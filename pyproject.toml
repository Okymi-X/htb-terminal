[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htbx"
dynamic = ["version"]
description = "Terminal client for selected Hack The Box Labs API workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Okymi" }]
keywords = ["hackthebox", "htb", "cli", "pentesting", "ctf", "vpn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
screenshots = ["rich>=13.7,<15"]

[project.urls]
Homepage = "https://github.com/Okymi-X/htb-terminal"
Repository = "https://github.com/Okymi-X/htb-terminal"
Issues = "https://github.com/Okymi-X/htb-terminal/issues"
Changelog = "https://github.com/Okymi-X/htb-terminal/releases"

[project.scripts]
htb = "htb_terminal.cli:main"
htbx = "htb_terminal.cli:main"

[tool.setuptools]
packages = ["htb_terminal", "htb_terminal.services"]

[tool.setuptools.dynamic]
version = { attr = "htb_terminal.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
